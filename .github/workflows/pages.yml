name: Deploy site (GitHub Pages)

# Publica a versão web do STOKK gratuitamente pelo GitHub Pages, sem gastar
# nada do Netlify. Roda automaticamente a cada push na branch main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm ci

      - name: Compilar o site (Vite)
        run: npm run build
        env:
          GH_PAGES: true

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar o site compilado
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
